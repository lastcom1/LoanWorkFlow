name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite, pdo_sqlite, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl, zip, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          # Installer stays off; demo seed allowed for local-like CI env
          printf '\nINSTALLER_ENABLED=false\nSEED_DEMO_DATA=true\n' >> .env

      - name: Run tests
        run: php artisan test
